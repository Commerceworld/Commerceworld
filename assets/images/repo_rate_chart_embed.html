<div class="rp" id="rp-chart">
  <div class="rp-title">India repo rate, 2016-2026</div>
  <p class="rp-sub">RBI policy repo rate. Now <b>5.50%</b>, raised by 0.25 percentage points on 7 October 2026.</p>
  <div class="rp-wrap" id="rp-wrap">
    <svg id="rp-svg" viewBox="0 0 640 400" role="img" aria-labelledby="rp-t rp-d">
      <title id="rp-t">India repo rate, November 2016 to November 2026</title>
      <desc id="rp-d">Step chart. The rate fell from 6.25% in 2016 to a low of 4.00% in 2020, rose to 6.50% by February 2023, was cut to 5.25% by December 2025, and was raised to 5.50% in October 2026.</desc>
    </svg>
    <div class="rp-tip" id="rp-tip" role="status"></div>
  </div>
  <p class="rp-src">Source: Reserve Bank of India. Tap or hover a point to see the date and rate.</p>
</div>
<style>
.rp{--bg:#ffffff;--tx:#000000;--mu:#555555;--gr:#e3e3e3;--ln:#F5B800;--pt:#000000;--tipbg:#000000;--tiptx:#F5B800;--bd:#000000;box-sizing:border-box;max-width:720px;margin:24px auto;padding:16px;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4;text-align:left}
.rp.rp-dark{--bg:#000000;--tx:#ffffff;--mu:#b5b5b5;--gr:#2e2e2e;--ln:#FFD60A;--tipbg:#FFD60A;--tiptx:#000000;--bd:#FFD60A}
.rp *{box-sizing:border-box}
.rp .rp-title{margin:0 0 4px;font-size:20px;line-height:1.25;font-weight:700;color:var(--tx)}
.rp .rp-sub{margin:0 0 12px;font-size:14px;color:var(--mu)}
.rp .rp-sub b{color:var(--tx)}
.rp .rp-wrap{position:relative}
.rp svg{display:block;width:100%;height:auto;overflow:visible}
.rp .gl{stroke:var(--gr);stroke-width:1}
.rp .ax{stroke:var(--tx);stroke-width:1.5}
.rp .tk{fill:var(--tx);font-size:12px}
.rp .ln{fill:none;stroke:var(--ln);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.rp .pt{fill:var(--ln);stroke:var(--pt);stroke-width:1.5}
.rp .hit{fill:transparent;cursor:pointer;outline:none}
.rp .hit:focus-visible{stroke:var(--tx);stroke-width:2}
.rp .now{fill:var(--tx);font-size:13px;font-weight:700}
.rp .rp-tip{position:absolute;pointer-events:none;background:var(--tipbg);color:var(--tiptx);font-size:13px;line-height:1.3;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.rp .rp-tip.on{opacity:1}
.rp .rp-src{margin:10px 0 0;font-size:12px;color:var(--mu)}
</style>
<script>
(function(){
  var root=document.getElementById("rp-chart");
  if(!root)return;
  var data=[
    [2016.87,6.25,"Nov 2016"],[2017.58,6.00,"Aug 2017"],[2018.43,6.25,"Jun 2018"],[2018.58,6.50,"Aug 2018"],
    [2019.10,6.25,"Feb 2019"],[2019.26,6.00,"Apr 2019"],[2019.43,5.75,"Jun 2019"],[2019.60,5.40,"Aug 2019"],
    [2019.76,5.15,"Oct 2019"],[2020.23,4.40,"Mar 2020"],[2020.39,4.00,"May 2020"],[2022.34,4.40,"May 2022"],
    [2022.43,4.90,"Jun 2022"],[2022.60,5.40,"Aug 2022"],[2022.75,5.90,"Sep 2022"],[2022.93,6.25,"Dec 2022"],
    [2023.10,6.50,"Feb 2023"],[2025.10,6.25,"Feb 2025"],[2025.27,6.00,"Apr 2025"],[2025.43,5.50,"Jun 2025"],
    [2025.93,5.25,"Dec 2025"],[2026.76,5.50,"Oct 2026"],[2026.88,5.50,"Nov 2026"]
  ];
  var W=640,H=400,L=50,R=20,T=24,B=38,X0=2016.8,X1=2027,Y0=3.5,Y1=7;
  function X(v){return L+(v-X0)/(X1-X0)*(W-L-R)}
  function Y(v){return H-B-(v-Y0)/(Y1-Y0)*(H-T-B)}
  function r(n){return Math.round(n*10)/10}
  var s="",i,v;
  for(v=Y0;v<=Y1+0.001;v+=0.5){
    s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+r(Y(v))+'" y2="'+r(Y(v))+'"/>';
    s+='<text class="tk" x="'+(L-8)+'" y="'+(r(Y(v))+4)+'" text-anchor="end">'+v.toFixed(1)+'%</text>';
  }
  s+='<line class="ax" x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(H-B)+'"/>';
  s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/>';
  for(v=2017;v<=2027;v+=2){
    s+='<text class="tk" x="'+r(X(v))+'" y="'+(H-B+20)+'" text-anchor="middle">'+v+'</text>';
  }
  var d="M"+r(X(data[0][0]))+" "+r(Y(data[0][1]));
  for(i=1;i<data.length;i++){d+=" H"+r(X(data[i][0]))+" V"+r(Y(data[i][1]));}
  s+='<path class="ln" d="'+d+'"/>';
  for(i=0;i<data.length-1;i++){
    s+='<circle class="pt" cx="'+r(X(data[i][0]))+'" cy="'+r(Y(data[i][1]))+'" r="4.5"/>';
  }
  var last=data[data.length-1];
  s+='<text class="now" x="'+r(X(last[0]))+'" y="'+(r(Y(last[1]))-12)+'" text-anchor="end">5.50% now</text>';
  for(i=0;i<data.length-1;i++){
    s+='<circle class="hit" tabindex="0" data-i="'+i+'" cx="'+r(X(data[i][0]))+'" cy="'+r(Y(data[i][1]))+'" r="14" aria-label="'+data[i][2]+': '+data[i][1].toFixed(2)+'%"/>';
  }
  var svg=document.getElementById("rp-svg");
  svg.insertAdjacentHTML("beforeend",s);
  var tip=document.getElementById("rp-tip");
  function show(i){
    var p=data[i],rect=svg.getBoundingClientRect(),k=rect.width/W;
    tip.textContent=p[2]+": "+p[1].toFixed(2)+"%";
    var px=X(p[0])*k,w=tip.offsetWidth/2+4;
    px=Math.max(w,Math.min(rect.width-w,px));
    tip.style.left=px+"px";
    tip.style.top=(Y(p[1])*k)+"px";
    tip.classList.add("on");
  }
  function hide(){tip.classList.remove("on")}
  Array.prototype.forEach.call(svg.querySelectorAll(".hit"),function(h){
    var i=+h.getAttribute("data-i");
    h.addEventListener("pointerenter",function(){show(i)});
    h.addEventListener("pointerdown",function(){show(i)});
    h.addEventListener("focus",function(){show(i)});
    h.addEventListener("blur",hide);
    h.addEventListener("pointerleave",hide);
  });
  document.addEventListener("pointerdown",function(e){if(!e.target.classList||!e.target.classList.contains("hit"))hide()});

  function lum(c){
    var m=c.match(/[\d.]+/g);
    if(!m||m.length<3)return null;
    if(m.length>3&&+m[3]===0)return null;
    var a=m.slice(0,3).map(function(n){n=n/255;return n<=0.03928?n/12.92:Math.pow((n+0.055)/1.055,2.4)});
    return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
  }
  function pageDark(){
    var el=root.parentElement,l=null;
    while(el&&l===null){l=lum(getComputedStyle(el).backgroundColor);el=el.parentElement;}
    if(l===null)return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
    return l<0.4;
  }
  var pending=false;
  function sync(){
    if(pending)return;
    pending=true;
    requestAnimationFrame(function(){
      pending=false;
      root.classList.toggle("rp-dark",pageDark());
    });
  }
  sync();
  new MutationObserver(sync).observe(document.documentElement,{attributes:true,subtree:true,attributeFilter:["class","data-theme","data-mode","style"]});
  document.addEventListener("click",function(){setTimeout(sync,120);setTimeout(sync,500)});
  if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",sync);
})();
</script>
