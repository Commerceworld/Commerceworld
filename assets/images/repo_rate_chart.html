<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India repo rate, 2016-2026</title>
<style>
:root{--bg:#ffffff;--tx:#000000;--mu:#555555;--gr:#e3e3e3;--ln:#F5B800;--pt:#000000;--tipbg:#000000;--tiptx:#F5B800;--bd:#000000}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--tx:#ffffff;--mu:#b5b5b5;--gr:#2e2e2e;--ln:#FFD60A;--pt:#000000;--tipbg:#FFD60A;--tiptx:#000000;--bd:#FFD60A}
}
:root[data-theme="dark"]{--bg:#000000;--tx:#ffffff;--mu:#b5b5b5;--gr:#2e2e2e;--ln:#FFD60A;--pt:#000000;--tipbg:#FFD60A;--tiptx:#000000;--bd:#FFD60A}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{max-width:720px;margin:0 auto;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:16px}
h1{margin:0 0 4px;font-size:20px;line-height:1.25;font-weight:700}
.sub{margin:0 0 12px;font-size:14px;color:var(--mu);line-height:1.4}
.sub b{color:var(--tx)}
.wrap{position:relative}
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--gr);stroke-width:1}
.ax{stroke:var(--tx);stroke-width:1.5}
.tk{fill:var(--tx);font-size:12px}
.ln{fill:none;stroke:var(--ln);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--ln);stroke:var(--pt);stroke-width:1.5}
.hit{fill:transparent;cursor:pointer;outline:none}
.hit:focus-visible{stroke:var(--tx);stroke-width:2}
.now{fill:var(--tx);font-size:13px;font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--tipbg);color:var(--tiptx);font-size:13px;line-height:1.3;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.src{margin:10px 0 0;font-size:12px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){.tip{transition:none}}
</style>
</head>
<body>
<div class="card">
  <h1>India repo rate, 2016-2026</h1>
  <p class="sub">RBI policy repo rate. Now <b>5.50%</b>, raised by 0.25 percentage points on 7 October 2026.</p>
  <div class="wrap" id="wrap">
    <svg id="chart" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
      <title id="t">India repo rate, November 2016 to November 2026</title>
      <desc id="d">Step chart. The rate fell from 6.25% in 2016 to a low of 4.00% in 2020, rose to 6.50% by February 2023, was cut to 5.25% by December 2025, and was raised to 5.50% in October 2026.</desc>
    </svg>
    <div class="tip" id="tip" role="status"></div>
  </div>
  <p class="src">Source: Reserve Bank of India. Tap or hover a point to see the date and rate.</p>
</div>
<script>
(function(){
  var data=[
    [2016.87,6.25,"Nov 2016"],[2017.58,6.00,"Aug 2017"],[2018.43,6.25,"Jun 2018"],[2018.58,6.50,"Aug 2018"],
    [2019.10,6.25,"Feb 2019"],[2019.26,6.00,"Apr 2019"],[2019.43,5.75,"Jun 2019"],[2019.60,5.40,"Aug 2019"],
    [2019.76,5.15,"Oct 2019"],[2020.23,4.40,"Mar 2020"],[2020.39,4.00,"May 2020"],[2022.34,4.40,"May 2022"],
    [2022.43,4.90,"Jun 2022"],[2022.60,5.40,"Aug 2022"],[2022.75,5.90,"Sep 2022"],[2022.93,6.25,"Dec 2022"],
    [2023.10,6.50,"Feb 2023"],[2025.10,6.25,"Feb 2025"],[2025.27,6.00,"Apr 2025"],[2025.43,5.50,"Jun 2025"],
    [2025.93,5.25,"Dec 2025"],[2026.76,5.50,"Oct 2026"],[2026.88,5.50,"Nov 2026"]
  ];
  var W=640,H=400,L=50,R=20,T=24,B=38,X0=2016.8,X1=2027,Y0=3.5,Y1=7;
  function X(v){return L+(v-X0)/(X1-X0)*(W-L-R)}
  function Y(v){return H-B-(v-Y0)/(Y1-Y0)*(H-T-B)}
  function r(n){return Math.round(n*10)/10}
  var s="",i,v;
  for(v=Y0;v<=Y1+0.001;v+=0.5){
    s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+r(Y(v))+'" y2="'+r(Y(v))+'"/>';
    s+='<text class="tk" x="'+(L-8)+'" y="'+(r(Y(v))+4)+'" text-anchor="end">'+v.toFixed(1)+'%</text>';
  }
  s+='<line class="ax" x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(H-B)+'"/>';
  s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/>';
  for(v=2017;v<=2027;v+=2){
    s+='<text class="tk" x="'+r(X(v))+'" y="'+(H-B+20)+'" text-anchor="middle">'+v+'</text>';
  }
  var d="M"+r(X(data[0][0]))+" "+r(Y(data[0][1]));
  for(i=1;i<data.length;i++){
    d+=" H"+r(X(data[i][0]))+" V"+r(Y(data[i][1]));
  }
  s+='<path class="ln" d="'+d+'"/>';
  for(i=0;i<data.length-1;i++){
    s+='<circle class="pt" cx="'+r(X(data[i][0]))+'" cy="'+r(Y(data[i][1]))+'" r="4.5"/>';
  }
  var last=data[data.length-1];
  s+='<text class="now" x="'+r(X(last[0]))+'" y="'+(r(Y(last[1]))-12)+'" text-anchor="end">5.50% now</text>';
  for(i=0;i<data.length-1;i++){
    s+='<circle class="hit" tabindex="0" data-i="'+i+'" cx="'+r(X(data[i][0]))+'" cy="'+r(Y(data[i][1]))+'" r="14" aria-label="'+data[i][2]+': '+data[i][1].toFixed(2)+'%"/>';
  }
  var svg=document.getElementById("chart");
  svg.insertAdjacentHTML("beforeend",s);
  var tip=document.getElementById("tip"),wrap=document.getElementById("wrap");
  function show(i){
    var p=data[i],rect=svg.getBoundingClientRect(),k=rect.width/W;
    tip.textContent=p[2]+": "+p[1].toFixed(2)+"%";
    var px=X(p[0])*k,w=tip.offsetWidth/2+4;
    px=Math.max(w,Math.min(rect.width-w,px));
    tip.style.left=px+"px";
    tip.style.top=(Y(p[1])*k)+"px";
    tip.classList.add("on");
  }
  function hide(){tip.classList.remove("on")}
  var hits=svg.querySelectorAll(".hit");
  Array.prototype.forEach.call(hits,function(h){
    var i=+h.getAttribute("data-i");
    h.addEventListener("pointerenter",function(){show(i)});
    h.addEventListener("pointerdown",function(){show(i)});
    h.addEventListener("focus",function(){show(i)});
    h.addEventListener("blur",hide);
    h.addEventListener("pointerleave",hide);
  });
  document.addEventListener("pointerdown",function(e){if(!e.target.classList||!e.target.classList.contains("hit"))hide()});
})();
</script>
</body>
</html>
