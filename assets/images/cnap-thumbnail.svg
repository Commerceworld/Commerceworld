<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F5C"/>
      <stop offset="1" stop-color="#143A9A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="320" r="320" fill="url(#glow)"/>
  <g fill="none" stroke="#6FA3FF" stroke-opacity="0.25" stroke-width="2">
    <circle cx="900" cy="320" r="200"/>
    <circle cx="900" cy="320" r="270"/>
    <circle cx="900" cy="320" r="340"/>
  </g>

  <!-- Left text -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="70" y="80" width="230" height="38" rx="19" fill="#FFB400"/>
    <text x="185" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1F5C" letter-spacing="2">TELECOM · DoT · TRAI</text>

    <text x="70" y="215" font-size="68" font-weight="700" fill="#FFFFFF">Caller Names</text>
    <text x="70" y="295" font-size="68" font-weight="700" fill="#FFFFFF">Now Show on</text>
    <text x="70" y="375" font-size="68" font-weight="700" fill="#FFB400">Every Call</text>

    <text x="70" y="440" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#C9D8FF">CNAP goes live from November 1</text>
    <text x="70" y="478" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9DB6F2">What it means for you and for businesses</text>

    <line x1="70" y1="540" x2="130" y2="540" stroke="#FFB400" stroke-width="4"/>
    <text x="70" y="580" font-size="30" font-weight="700" fill="#FFFFFF">EconomicPulse</text>
  </g>

  <!-- Phone -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="770" y="50" width="260" height="530" rx="38" fill="#0A0F1E" stroke="#8FB2FF" stroke-width="3"/>
    <rect x="784" y="64" width="232" height="502" rx="28" fill="#161C33"/>
    <rect x="870" y="74" width="60" height="10" rx="5" fill="#0A0F1E"/>

    <text x="900" y="150" text-anchor="middle" font-size="15" fill="#8FA0C8" letter-spacing="2">INCOMING CALL</text>
    <text x="900" y="205" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">John Doe</text>
    <text x="900" y="240" text-anchor="middle" font-size="20" fill="#B8C4E6" letter-spacing="2">9876XXXXXX</text>

    <circle cx="900" cy="330" r="55" fill="#2A3560"/>
    <circle cx="900" cy="312" r="20" fill="#C9D8FF"/>
    <path d="M858 380 Q900 330 942 380 Z" fill="#C9D8FF"/>

    <!-- Verified tick -->
    <circle cx="945" cy="372" r="16" fill="#22C55E" stroke="#161C33" stroke-width="4"/>
    <path d="M937 372 l6 6 l11 -12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Buttons -->
    <circle cx="840" cy="500" r="30" fill="#E53935"/>
    <path d="M826 504 q14 -12 28 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="840" y="548" text-anchor="middle" font-size="13" fill="#B8C4E6">Decline</text>

    <circle cx="960" cy="500" r="30" fill="#22C55E"/>
    <path d="M950 492 q2 18 18 22 l4 -6 l-8 -5 l-3 3 q-6 -3 -8 -9 l3 -3 l-5 -8 z" fill="#FFFFFF"/>
    <text x="960" y="548" text-anchor="middle" font-size="13" fill="#B8C4E6">Accept</text>
  </g>

  <!-- Old "Unknown" card, struck out -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="rotate(-6 1055 190)">
      <rect x="985" y="150" width="170" height="80" rx="16" fill="#1B2550" stroke="#FF6B6B" stroke-width="2.5"/>
      <circle cx="1022" cy="190" r="18" fill="#2F3A6E"/>
      <text x="1022" y="198" text-anchor="middle" font-size="24" font-weight="700" fill="#9DB6F2">?</text>
      <text x="1050" y="196" font-size="22" fill="#9DB6F2">Unknown</text>
      <line x1="995" y1="215" x2="1145" y2="165" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
